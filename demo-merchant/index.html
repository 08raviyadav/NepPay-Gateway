<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Himalayan Store — NepPay Gateway demo</title>
<style>body{font-family:system-ui;max-width:560px;margin:40px auto;padding:0 16px}button{padding:12px 18px;font-size:16px;cursor:pointer}pre{background:#f4f4f4;padding:12px;white-space:pre-wrap}</style></head>
<body><h1>Himalayan Store 🧣</h1><p>Pashmina shawl — <b>NPR 500</b></p>
<button id="buy">Buy with NepPay Gateway</button>
<pre id="out">Gateway must be running: cd backend && node server.js</pre>
<script>
const BASE='http://localhost:8788', KEY='pk_test_neppay_demo';
document.getElementById('buy').onclick=async()=>{
  const out=document.getElementById('out');
  const cs=await (await fetch(BASE+'/v1/checkout-sessions',{method:'POST',headers:{'Content-Type':'application/json','X-API-Key':KEY},body:JSON.stringify({amount:500,orderId:'ORDER-WEB-1'})})).json();
  out.textContent='Session created:\n'+JSON.stringify(cs,null,2)+'\n\nOpening hosted checkout…';
  window.open(cs.checkoutUrl,'_blank');
};
</script></body></html>
